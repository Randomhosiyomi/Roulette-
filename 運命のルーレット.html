<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>運命のルーレット</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: flex; justify-content: center;
  align-items: center; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
  background: radial-gradient(circle at top, #3b3b68, #11111f 65%);
  color: white; overflow: hidden;
}
.container { width: min(92vw, 430px); text-align: center; }
h1 { margin: 0 0 8px; font-size: 28px; }
.subtitle { opacity: .75; margin-bottom: 18px; }
.wheel-wrap { position: relative; width: min(78vw, 330px); aspect-ratio: 1; margin: auto; }
.pointer {
  position: absolute; z-index: 5; top: -7px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 15px solid transparent; border-right: 15px solid transparent;
  border-top: 30px solid #fff;
  filter: drop-shadow(0 3px 3px #000);
}
#wheel {
  width: 100%; height: 100%; border-radius: 50%;
  border: 8px solid white; box-shadow: 0 8px 30px #0008;
  background: conic-gradient(
    #ff6b6b 0deg 45deg, #ffd93d 45deg 90deg,
    #6bcb77 90deg 135deg, #4d96ff 135deg 180deg,
    #b07cff 180deg 225deg, #ff8fab 225deg 270deg,
    #6ee7e7 270deg 315deg, #ff9f43 315deg 360deg
  );
  transition: transform 4s cubic-bezier(.12,.75,.12,1);
}
.labels { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute; left: 50%; top: 50%; width: 42%; height: 22px;
  margin-left: -21%; margin-top: -11px;
  transform-origin: 50% 50%; font-weight: 800; font-size: 14px;
  text-shadow: 0 1px 2px #0008;
}
button {
  border: 0; border-radius: 999px; padding: 15px 35px; margin-top: 25px;
  font-size: 18px; font-weight: 800; cursor: pointer;
  background: white; color: #171725; box-shadow: 0 6px 18px #0006;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .5; }
#result { min-height: 45px; margin-top: 18px; font-size: 19px; font-weight: 700; }
.win, .lose { animation: pop .45s ease; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

#giftScreen {
  display: none; position: fixed; inset: 0; z-index: 20;
  background: radial-gradient(circle, #33205c, #090912 75%);
  align-items: center; justify-content: center; padding: 25px;
}
.gift-box {
  width: 190px; height: 155px; position: relative; cursor: pointer;
  margin: 30px auto 10px; animation: float 1.5s ease-in-out infinite alternate;
}
.box {
  position: absolute; bottom: 0; width: 100%; height: 105px;
  background: linear-gradient(135deg, #e83e5b, #9b1830);
  border-radius: 8px; box-shadow: 0 12px 30px #0008;
}
.lid {
  position: absolute; top: 25px; left: -7px; width: calc(100% + 14px); height: 35px;
  background: #ff5570; border-radius: 8px; z-index: 2;
}
.ribbon-v { position: absolute; left: 42%; width: 16%; height: 100%; background: #ffd43b; z-index: 3; }
.ribbon-h { position: absolute; top: 0; left: 0; width: 100%; height: 27%; background: #ffd43b; z-index: 3; }
.bow { position:absolute; top:0; left:50%; transform:translateX(-50%); width:75px; height:45px; z-index:4; }
.bow:before,.bow:after { content:""; position:absolute; width:45px; height:30px; background:#ffd43b; border-radius:50% 50% 10% 50%; top:0; }
.bow:before { right:32px; transform:rotate(-20deg); }
.bow:after { left:32px; transform:rotate(20deg) scaleX(-1); }
@keyframes float { to { transform: translateY(-8px); } }

#reveal {
  display:none; position:fixed; inset:0; z-index:30; background:#08080d;
  align-items:center; justify-content:center; text-align:center; padding:25px;
}
.reveal-content { animation: pop .6s ease; }
.reveal-content h2 { font-size:38px; margin:0 0 18px; }
.reveal-content p { font-size:25px; line-height:1.5; margin:0; }
.small { opacity:.55; font-size:13px !important; margin-top:28px !important; }
</style>
</head>
<body>

<div class="container">
  <h1>🎰 運命のルーレット</h1>
  <div class="subtitle">8分の1で何かが起こる……</div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div id="wheel"></div>
    <div class="labels" id="labels"></div>
  </div>

  <button id="spin">ルーレットを回す</button>
  <div id="result"></div>
</div>

<div id="giftScreen">
  <div style="text-align:center">
    <h1>🎉 おめでとう！</h1>
    <p style="font-size:28px; font-weight:900;">ラッキーだね！</p>
  </div>
</div>



<script>
const wheel = document.getElementById("wheel");
const spinBtn = document.getElementById("spin");
const result = document.getElementById("result");
const giftScreen = document.getElementById("giftScreen");
const gift = document.getElementById("gift");

const texts = ["残念！", "もう一回！", "はずれ！", "何もなし！",
               "惜しい！", "また挑戦！", "ざんねん！", "大当たり！"];

for (let i = 0; i < 8; i++) {
  const el = document.createElement("div");
  el.className = "label";
  el.textContent = texts[i];
  el.style.transform = `rotate(${i*45+22.5}deg) translateX(42%)`;
  document.getElementById("labels").appendChild(el);
}

let rotation = 0;
let busy = false;

spinBtn.addEventListener("click", () => {
  if (busy) return;
  busy = true;
  spinBtn.disabled = true;
  result.textContent = "";

  // 1/8 chance of winning
  const win = Math.floor(Math.random() * 8) === 0;

  // Choose a segment and add several full rotations.
  const segment = win ? 7 : Math.floor(Math.random() * 7);
  const targetAngle = 360 - (segment * 45 + 22.5);
  rotation += 360 * 6 + targetAngle;
  wheel.style.transform = `rotate(${rotation}deg)`;

  setTimeout(() => {
    if (win) {
      giftScreen.style.display = "flex";
    } else {
      result.innerHTML = `<div class="lose">💨 ${texts[segment]}</div>`;
      spinBtn.disabled = false;
      busy = false;
    }
  }, 4100);
});

giftScreen.addEventListener("click", () => {
  giftScreen.style.display = "none";
  spinBtn.disabled = false;
  busy = false;
});
</script>
</body>
</html>
